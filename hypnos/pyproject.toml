[project]
name = "hypnos"
version = "0.9.1"
description = "Hypnos: human-like memory for AI agents. Notes everything, sorts it while it sleeps, recalls with evidence (architecture v0.9)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
vectors = ["fastembed>=0.3", "numpy"]
all = ["mcp>=1.2", "fastembed>=0.3", "numpy"]
dev = ["pytest"]

[project.scripts]
hypnos = "hypnos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypnos"]
