[package]
name = "agentmem"
version = "0.8.0"
edition = "2021"
description = "Evidence-linked agent memory with sleep consolidation and Jev-routed recall (Rust engine)"
license-file = "../LICENSE"
authors = ["Luza Maharjan"]

[[bin]]
name = "agentmem"
path = "src/main.rs"

[features]
default = ["vectors"]
vectors = ["dep:fastembed"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ureq = { version = "2", features = ["json"] }
tiny_http = "0.12"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fastembed = { version = "4", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
